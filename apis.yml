name: World Kinect
description: >-
  World Kinect Corporation (NYSE: WKC), formerly World Fuel Services, is a Fortune 500 energy,
  commodities and services company headquartered in Doral, Florida. It supplies and manages
  aviation, marine and land fuel, lubricants, natural gas, power, water and carbon-management
  services for airlines, business aviation operators, shipping lines, commercial fleets, fuel
  retailers and industrial customers in more than 200 countries. Its digital surface is a family
  of authenticated customer portals — myWorld for aviation, land, marine and carbon management,
  World Kinect Online for energy services, and the Flyers Energy and Quick Fuel Vantage/Advantage
  portals — plus a fuel-price and AVCARD integration that reaches operators through third-party
  flight-operations platforms. World Kinect publishes no public developer portal, API reference
  or machine-readable API contract.
