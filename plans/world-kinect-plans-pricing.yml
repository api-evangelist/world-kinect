note: >-
  World Kinect publishes no plans, tiers, list prices or self-serve pricing of any kind. Every
  commercial surface is a negotiated B2B supply or services agreement — fuel, lubricants, natural
  gas, power, water and carbon-management contracts priced per customer, per market and per
  delivery point. The 394-URL sitemap at https://www.world-kinect.com/sitemap.xml carries no
  pricing page, and the only commercial call to action is a contact or credit-application form.
  There is likewise no API pricing, because there is no public API product: the fuel-price and
  AVCARD integration reaches operators through their own flight-operations platform under an
  existing World Fuel customer agreement.
