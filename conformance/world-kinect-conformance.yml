name: World Kinect — standards conformance
note: >-
  An honest negative record. World Kinect publishes no API contract, so there is no spec in which a
  standard could be declared and no conformance claim to verify. Nothing below is asserted as
  conforming. The domain-standard signature check (0.12.0) also came back empty: World Kinect's
  markets do carry real interchange standards — IATA XML / IFRS for aviation fuel uplift, EDIFACT
  and X12 for bulk fuel and logistics, ISO 20022 for settlement, and the energy-sector data models
  used in utility and carbon reporting — but none of them is declared or evidenced on any public
  World Kinect surface, so no domain-standard conformance is recorded. Reward-only: a standard the
  provider never claimed is not a penalty, and inventing one to fill the slot is out of bounds.
